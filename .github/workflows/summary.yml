#
# Upptime template workflow, kept as generated for v1.46.5. The setup and
# template-update workflows were removed (they rewrite these files and need
# a token with the workflows scope), so edit here by hand; see README.md.
#
# 🔼 Upptime @v1.46.5
# GitHub-powered open-source uptime monitor and status page by Anand Chowdhary

# * Source: https://github.com/upptime/upptime
# * Docs and more: https://upptime.js.org
# * More by Anand Chowdhary: https://anandchowdhary.com


name: Summary CI
on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [summary]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Generate README
    runs-on: ubuntu-latest
    env:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
    steps:
      - name: Create GitHub App token
        id: app_token
        if: ${{ vars.GH_APP_ID != '' && env.GH_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
      - name: Clear GitHub App private key
        if: ${{ always() }}
        shell: bash
        run: echo "GH_APP_PRIVATE_KEY=" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
      - name: Update summary in README
        uses: upptime/uptime-monitor@v1.46.5
        with:
          command: "readme"
        env:
          GH_PAT: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}

#
# Upptime template workflow, kept as generated for v1.46.5. The setup and
# template-update workflows were removed (they rewrite these files and need
# a token with the workflows scope), so edit here by hand; see README.md.
#
# 🔼 Upptime @v1.46.5
# GitHub-powered open-source uptime monitor and status page by Anand Chowdhary

# * Source: https://github.com/upptime/upptime
# * Docs and more: https://upptime.js.org
# * More by Anand Chowdhary: https://anandchowdhary.com


name: Uptime CI
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Check status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ github.token }}
      - name: Record statuses before the check
        run: bash .github/scripts/alert.sh snapshot history > "$RUNNER_TEMP/before"
      - name: Check endpoint status
        uses: upptime/uptime-monitor@74f0683383384927e064d76a5f21f340d6af36fc # v1.46.5
        with:
          command: "update"
        env:
          GH_PAT: ${{ github.token }}
          # No secret reaches the action: alert.sh sends one grouped Telegram
          # message instead of Upptime's one per site (SPEC-047 D9).
          SECRETS_CONTEXT: '{}'
      - name: Send one grouped alert on a change of state
        if: always()
        env:
          TELEGRAM_BOT_KEY: ${{ secrets.NOTIFICATION_TELEGRAM_BOT_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.NOTIFICATION_TELEGRAM_CHAT_ID }}
        run: bash .github/scripts/alert.sh "$RUNNER_TEMP/before" history

# Outside uptime check for the Noduma coordinator (danielitogomez/Noduma,
# SPEC-047). Runs on GitHub, not in the Civo cluster, so it still reports
# when the whole cluster is gone. Down and up messages go to the operators'
# Telegram group "NodumaOps" (secrets NOTIFICATION_TELEGRAM*).
owner: danielitogomez
repo: noduma-status
user-agent: noduma-status

sites:
  - name: Noduma coordinator
    url: https://74-220-25-65.sslip.io/healthz
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

status-website:
  baseUrl: /noduma-status
  name: Noduma status
  introTitle: "**Noduma** coordinator status"
  introMessage: Checked every 5 minutes from GitHub Actions, outside the cluster.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
